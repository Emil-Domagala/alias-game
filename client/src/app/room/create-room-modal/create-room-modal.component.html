<h1>Create room</h1>

<form (ngSubmit)="onSubmit($event)">
  <app-form-field
    label="Room name"
    forId="name"
    [formField]="createRoom.name"
  >
    <input
      id="name"
      type="text"
      [formField]="createRoom.name"
      placeholder="Room name"
    />
  </app-form-field>

  <app-form-field
    label="Minimum players"
    forId="minPlayers"
    [formField]="createRoom.minPlayers"
  >
    <input
      id="minPlayers"
      type="number"
      [formField]="createRoom.minPlayers"
    />
  </app-form-field>

  <app-form-field
    label="Maximum players"
    forId="maxPlayers"
    [formField]="createRoom.maxPlayers"
  >
    <input
      id="maxPlayers"
      type="number"
      [formField]="createRoom.maxPlayers"
    />
  </app-form-field>

  <app-form-field
    label="Number of teams"
    forId="numberOfTeams"
    [formField]="createRoom.numberOfTeams"
  >
    <input
      id="numberOfTeams"
      type="number"
      [formField]="createRoom.numberOfTeams"
    />
  </app-form-field>

  <button
    type="submit"
    [disabled]="createRoom().invalid()"
    class="btn btn-primary"
  >
    Create room
  </button>
</form>

<button (click)="close()">Close</button>
