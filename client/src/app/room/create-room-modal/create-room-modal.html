<h1>Create room</h1>
<form (submit)="$event.preventDefault(); submit()">

  <input type="number" [field]="createRoom.maxPlayers" />
  <input type="number" [field]="createRoom.minPlayers" />
  <input type="number" [field]="createRoom.numberOfTeams" />
  <input type="text" [field]="createRoom.name" />

  <button type="submit" [disabled]="createRoom().invalid()">
    Register
  </button>

</form>
