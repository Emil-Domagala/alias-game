<h1>Login</h1>

<form (submit)="submit($event)">
  <app-form-field
    label="Email"
    forId="email"
    [formField]="loginForm.email"
  >
    <input
      id="email"
      type="email"
      [formField]="loginForm.email"
      placeholder="you@example.com"
    />
  </app-form-field>

  <app-form-field
    label="Password"
    forId="password"
    [formField]="loginForm.password"
  >
    <input
      id="password"
      type="password"
      [formField]="loginForm.password"
    />
  </app-form-field>

  <button type="submit" [disabled]="loginForm().invalid()" class="btn btn-primary">
    Login
  </button>

  <p class="auth-switch">
    Don't have an account yet?
    <a [routerLink]="[AUTH_ROUTES_FULL.REGISTER]" class="link">Register here</a>.
  </p>


</form>
