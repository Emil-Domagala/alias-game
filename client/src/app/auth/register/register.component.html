<h1>Register</h1>

<form (submit)="submit($event)">
  <app-form-field
    label="Email"
    forId="email"
    [field]="registerForm.email"
  >
    <input
      id="email"
      type="email"
      [field]="registerForm.email"
      placeholder="you@example.com"
    />
  </app-form-field>

  <app-form-field
    label="Username"
    forId="nick"
    [field]="registerForm.nick"
  >
    <input
      id="nick"
      type="text"
      [field]="registerForm.nick"
      placeholder="your username"
    />
  </app-form-field>

  <app-form-field
    label="Password"
    forId="password"
    [field]="registerForm.password"
  >
    <input
      id="password"
      type="password"
      [field]="registerForm.password"
    />
  </app-form-field>

  <button
    type="submit"
    [disabled]="registerForm().invalid()"
    class="btn btn-primary"
  >
    Register
  </button>

  <p class="auth-switch">
    Already have an account?
    <a [routerLink]="['/','auth','login']" class="link">Login here</a>.
  </p>

</form>
